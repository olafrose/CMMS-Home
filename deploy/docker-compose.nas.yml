# Run-only compose for the Synology NAS: pulls/uses prebuilt images (no build,
# no source needed on the NAS). Values come from the .env file next to this file.
#   API_IMAGE / WEB_IMAGE : full image refs (registry push) OR local tags (docker load)
#   DB_PASSWORD           : Postgres password (set once, before first run)
#   DOCS_PATH             : NAS shared folder for documents (mounted read-WRITE; app
#                           writes only in inbox/ and library/ — see .env.example)
#   MANAGED_FOLDERING     : true = move classified files into library/<Category>/
#   PUID / PGID           : UID:GID the api runs as — must be able to write DOCS_PATH
#   WEB_PORT              : host port to browse the app on
#   SWAGGER_PROXY         : false = don't serve the API docs at /swagger on WEB_PORT
#
# Only the web port is published. The API and DB stay on the internal network
# (the web container proxies /api and /swagger to the api container), so don't
# expose them.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cmms
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    # The chiseled .NET image runs as non-root UID 1654, which can't write the
    # NAS share. Run as a DSM user/group that CAN write DOCS_PATH so uploads and
    # managed-foldering moves succeed (default = first DSM user : "users" group).
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=cmms;Username=cmms;Password=${DB_PASSWORD}
      - Documents__RootPath=/documents
      # Managed foldering: uploads → /documents/inbox, classify → /documents/library/<Category>/.
      # The app writes ONLY inside inbox/ and library/. Requires the rw mount below.
      - Documents__ManagedFoldering=${MANAGED_FOLDERING:-true}
    volumes:
      - ${DOCS_PATH}:/documents:rw
    depends_on:
      - db

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      - API_URL=http://api:8080
      # Swagger UI + OpenAPI doc at /swagger on WEB_PORT, proxied to the api
      # container. The only route to them here, since the api port isn't published.
      - SWAGGER_PROXY=${SWAGGER_PROXY:-true}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
