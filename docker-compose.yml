services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cmms
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: cmms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: src/CmmsHome.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=cmms;Username=cmms;Password=cmms
      - Documents__RootPath=/documents
    volumes:
      # Local inbox folder in the repo — drop files in ./docs-inbox to have them scanned.
      - ./docs-inbox:/documents:ro
    depends_on:
      - db

  web:
    build:
      context: ./src/cmms-home-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8080
      # Set this to override the base URL encoded in QR codes.
      # Useful when accessing via reverse proxy, custom DNS, or VPN.
      # Example: NEXT_PUBLIC_QR_BASE_URL=https://cmms.myhome.net
      # Requires rebuilding the web container after changing.
    depends_on:
      - api

volumes:
  postgres_data:

# Documents are scanned from the ./docs-inbox bind mount above. To use a real
# NAS/SMB share instead, replace the api `volumes:` entry with a cifs mount, e.g.:
#   - type: volume
#     source: documents
#     target: /documents
# plus a top-level `documents:` volume using driver_opts type=cifs, device=//NAS/cmms-docs.
